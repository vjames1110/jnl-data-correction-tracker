databases:
  - name: jnl-dct-db
    databaseName: jnl_dct
    user: jnl_dct

services:
  - type: web
    name: jnl-data-correction-tracker-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jnl-dct-db
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: APP_FRONTEND_BASE_URL
        sync: false
      - key: NOTIFICATION_EMAILS_ENABLED
        value: "False"
      - key: NOTIFICATION_EMAIL_TIMEOUT_SECONDS
        value: "10"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: BREVO_SENDER_EMAIL
        value: correctionjnl@gmail.com
      - key: BREVO_SENDER_NAME
        value: JNL Approval Management System
